<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>病院経営ニュース ブリーフィング</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<!-- iOS（Safari）はWeb App Manifestの対応が不完全なため、Apple独自のmeta/linkで
     「ホーム画面に追加」時のアプリ名・アイコン・スタンドアロン表示を指定する -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="病院経営ニュース ブリーフィング">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1c1e21;
    --muted: #6b7280;
    --border: #e3e5e8;
    --accent: #2563eb;
    --danger: #e5484d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --card-bg: #202329;
      --text: #ecedee;
      --muted: #9aa0a8;
      --border: #34383f;
      --accent: #6ea8fe;
      --danger: #ff6b6f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 12px 40px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.6;
  }

  /* ---- ロック画面 ---- */
  #lock {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lock-card {
    width: 100%;
    max-width: 340px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 22px;
    text-align: center;
  }
  .lock-card h1 {
    font-size: 1.1rem;
    margin: 0 0 18px;
  }
  .lock-card input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    margin-bottom: 12px;
  }
  .lock-card button {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .lock-error {
    color: var(--danger);
    font-size: 0.85rem;
    margin-top: 10px;
    min-height: 1.2em;
  }

  /* ---- 共通レイアウト ---- */
  header.page-header {
    padding: 20px 4px 12px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .generated-at { color: var(--muted); font-size: 0.85rem; }
  .comment {
    margin-top: 10px;
    padding: 10px 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.95rem;
  }
  section { margin-top: 22px; }
  h2 {
    font-size: 1.05rem;
    margin: 0 0 10px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--accent);
  }
  .event {
    display: flex;
    gap: 10px;
    padding: 8px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 0.92rem;
  }
  .event:last-child { border-bottom: none; }
  .event-time { flex: 0 0 auto; color: var(--accent); font-weight: 600; white-space: nowrap; }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 6px 4px; }

  /* ---- タブ ---- */
  .tabs { margin-top: 18px; }
  .tab-nav {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    flex: 0 0 auto;
    padding: 8px 14px;
    font-size: 0.88rem;
    border: none;
    background: transparent;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tab-panel { display: none; padding-top: 14px; }
  .tab-panel.active { display: block; }

  /* ---- 記事カード ---- */
  .source-heading {
    font-size: 0.85rem;
    color: var(--muted);
    margin: 16px 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .source-heading:first-child { margin-top: 0; }
  .article {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .article a { color: var(--text); text-decoration: none; font-weight: 600; font-size: 0.98rem; }
  .article a:active, .article a:hover { color: var(--accent); }
  .article-meta { margin-top: 4px; font-size: 0.78rem; color: var(--muted); }
  .impact-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  .article-summary { margin-top: 6px; font-size: 0.88rem; }

  /* ---- 病床KPIカード ---- */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .kpi-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .kpi-card .kpi-label { font-size: 0.78rem; color: var(--muted); }
  .kpi-card .kpi-value {
    font-size: 1.5rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }
  .kpi-card .kpi-unit { font-size: 0.8rem; color: var(--muted); margin-left: 2px; }
  .kpi-card .kpi-value-row {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    column-gap: 10px;
    row-gap: 2px;
  }
  .kpi-card .kpi-detail { font-size: 0.85rem; color: var(--muted); }
  .kpi-card.kpi-error .kpi-value { font-size: 0.85rem; color: var(--danger); font-weight: 400; }
  .kpi-note { font-size: 0.75rem; color: var(--muted); margin-top: 10px; }
  .forecast-table-wrap { overflow-x: auto; margin-top: 8px; }
  .forecast-table { width: 100%; min-width: 420px; border-collapse: collapse; font-size: 0.88rem; }
  .forecast-table th, .forecast-table td {
    padding: 8px 6px;
    border-bottom: 1px solid var(--border);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .forecast-table th:first-child, .forecast-table td:first-child { text-align: left; }
</style>
</head>
<body>

<div id="lock">
  <div class="lock-card">
    <h1>🔒 病院経営ニュース ブリーフィング</h1>
    <form id="lock-form">
      <input type="password" id="lock-password" autocomplete="current-password" placeholder="パスワード" autofocus>
      <button type="submit">開く</button>
      <div class="lock-error" id="lock-error"></div>
    </form>
  </div>
</div>

<div id="app" style="display:none"></div>

  var ITERATIONS = 250000;

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function deriveKey(password) {
    var enc = new TextEncoder();
    var keyMaterial = await crypto.subtle.importKey(
      "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64ToBytes(SALT_B64), iterations: ITERATIONS, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
  }

  async function unlock(password) {
    var key = await deriveKey(password);
    var iv = b64ToBytes(IV_B64);
    var ciphertext = b64ToBytes(CIPHERTEXT_B64);
    var plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ciphertext);
    return new TextDecoder().decode(plainBuf);
  }

  var form = document.getElementById("lock-form");
  var errorEl = document.getElementById("lock-error");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var password = document.getElementById("lock-password").value;
    errorEl.textContent = "";
    unlock(password).then(function (html) {
      document.getElementById("app").innerHTML = html;
      document.getElementById("app").style.display = "";
      document.getElementById("lock").style.display = "none";
    }).catch(function () {
      errorEl.textContent = "パスワードが違います。";
    });
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js").catch(function () {});
  }

  // タブ切り替え（#app注入後の要素にも効くようイベント委譲）
  document.getElementById("app").addEventListener("click", function (e) {
    var btn = e.target.closest(".tab-btn");
    if (!btn) return;
    var group = btn.closest(".tabs");
    group.querySelectorAll(".tab-btn").forEach(function (b) { b.classList.remove("active"); });
    btn.classList.add("active");
    var target = btn.getAttribute("data-tab");
    group.querySelectorAll(".tab-panel").forEach(function (p) {
      p.classList.toggle("active", p.getAttribute("data-tab-panel") === target);
    });
  });
})();
